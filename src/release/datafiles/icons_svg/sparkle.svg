  <defs>
    <!-- Same theme-integrated gradient as submit_arrow.svg: the
         blender_ stop ids are rewritten at draw time from
         ThemeMixieChat.chat_send_icon_gradient_start/_end
         (interface_icons.cc icon_source_edit_cb), so this icon always
         matches the chat send button. Stop colors below are the Mixar
         default theme values, kept as a sane fallback. -->
    <linearGradient
       id="sparkle_gradient"
       x1="0"
       y1="0"
       x2="60"
       y2="60"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         id="blender_send_icon_gradient_start"
         style="stop-color:#00C0C7;stop-opacity:1" />
      <stop
         offset="100%"
         id="blender_send_icon_gradient_end"
         style="stop-color:#85C449;stop-opacity:1" />
    </linearGradient>
  </defs>
