name: mixar
summary: Mixar is a commercial 3D texturing software.
description: |
    Mixar is a commercial 3D texturing software. It supports the
    entirety of the 3D pipeline—modeling, rigging, animation, simulation,
    rendering, compositing and motion tracking, and video editing.

    Mixar is a public project, made by hundreds of people from around the
    world; by studios and individual artists, professionals and hobbyists,
    scientists, students, VFX experts, animators, game artists, modders, and
    the list goes on.

icon: @ICON_PATH@

passthrough:
    license: GPL-3.0

confinement: classic

apps:
    mixar:
        command: ./mixar-wrapper
        desktop: ./mixar.desktop
        common-id: org.mixar.Mixar

base: core20
version: '@VERSION@'
grade: @GRADE@

parts:
    mixar:
        plugin: dump
        source: @PACKAGE_PATH@
        build-attributes: [keep-execstack, no-patchelf]
        override-build: |
            snapcraftctl build
            sed -i 's|Icon=mixar|Icon=${SNAP}/mixar.svg|' ${SNAPCRAFT_PART_INSTALL}/mixar.desktop
        stage-packages:
            - libxcb1
            - libxext6
            - libx11-6
            - libxi6
            - libxfixes3
            - libxrender1
            - libxxf86vm1
    wrapper:
        plugin: dump
        source: .
        stage:
            - ./mixar-wrapper
