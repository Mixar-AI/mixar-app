[pytest]
testpaths =
    tests
    src/scripts/mixar/modules/space_mixie_chat/tests
    src/scripts/mixar/modules/paint/layered_build/tests
    src/scripts/mixar/modules/paint/procedural_materials/tests
pythonpath = src/scripts
norecursedirs =
    .git
    build
    source
    # tests/public_sync builds throwaway repos and needs bash + rsync (~45 s);
    # its own workflow runs it: python3 -m unittest discover -s tests/public_sync
    public_sync
